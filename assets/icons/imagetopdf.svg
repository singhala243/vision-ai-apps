<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#pdfBg)" />
  
  <!-- Image Frame -->
  <rect x="110" y="110" width="220" height="220" rx="28" fill="#EDE9FE" />
  <!-- Mountains in image -->
  <polygon points="130,300 190,210 240,270 280,220 315,300" fill="#8B5CF6" />
  <circle cx="165" cy="165" r="22" fill="#FBBF24" />
  
  <!-- PDF Target Document Badge -->
  <g transform="translate(230, 210)">
    <rect width="180" height="210" rx="24" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="6" />
    <rect x="25" y="40" width="130" height="12" rx="6" fill="#DDD6FE" />
    <rect x="25" y="70" width="100" height="12" rx="6" fill="#DDD6FE" />
    <rect x="25" y="100" width="130" height="12" rx="6" fill="#DDD6FE" />
    <rect x="25" y="130" width="80" height="12" rx="6" fill="#DDD6FE" />
    
    <!-- Red PDF Tag -->
    <rect x="20" y="155" width="85" height="35" rx="8" fill="url(#badgeGrad)" />
    <text x="62" y="180" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="19" font-weight="900" text-anchor="middle">PDF</text>
  </g>
</svg>