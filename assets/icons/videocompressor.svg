<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#compBg)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" />
  
  <!-- Outer Video Frame Container -->
  <rect x="96" y="116" width="320" height="280" rx="36" fill="#064E3B" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />
  
  <!-- Inward Compression Arrows / Clamp Elements -->
  <!-- Top Arrow pointing DOWN -->
  <path d="M256,150 L286,190 L268,190 L268,220 L244,220 L244,190 L226,190 Z" fill="url(#iconGrad)" filter="url(#shadow)" />
  
  <!-- Bottom Arrow pointing UP -->
  <path d="M256,362 L226,322 L244,322 L244,292 L268,292 L268,322 L286,322 Z" fill="url(#iconGrad)" filter="url(#shadow)" />
  
  <!-- Center Play / Video Core Bar -->
  <rect x="180" y="240" width="152" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" filter="url(#shadow)" />
  <polygon points="248,246 270,256 248,266" fill="#059669" />
  
  <!-- Badge: RESIZE MB -->
  <rect x="286" y="136" width="112" height="34" rx="10" fill="#059669" />
  <text x="342" y="159" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">RESIZE MB</text>
</svg>
