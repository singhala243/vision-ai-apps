<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Soundwave & Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Icon Group with Generous Safe Padding (Scaled 0.78 centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Outer Acoustic Ring (Subtle) -->
    <circle cx="256" cy="256" r="195" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="165" fill="none" stroke="#818CF8" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Protective Safety Shield Contour -->
    <path d="M 256 86 
             C 346 86, 386 110, 386 195 
             C 386 312, 290 388, 256 426 
             C 222 388, 126 312, 126 195 
             C 126 110, 166 86, 256 86 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#accentGlow)" 
          stroke-width="5" 
          filter="url(#softShadow)" />

    <!-- Centered Acoustic Equalizer Columns (Voice Spectrum 300Hz - 3.4kHz) -->
    <g filter="url(#glow)">
      <!-- Band 1: 250 Hz -->
      <rect x="180" y="220" width="14" height="72" rx="7" fill="url(#cyanGrad)" />
      
      <!-- Band 2: 500 Hz -->
      <rect x="210" y="180" width="14" height="152" rx="7" fill="url(#cyanGrad)" />
      
      <!-- Band 3: 1 kHz (Core Speech Clarity Peak) -->
      <rect x="240" y="145" width="16" height="222" rx="8" fill="#F8FAFC" />
      <rect x="242" y="148" width="12" height="216" rx="6" fill="url(#cyanGrad)" />

      <!-- Band 4: 2 kHz (Consonant Intelligibility) -->
      <rect x="272" y="170" width="16" height="172" rx="8" fill="#F8FAFC" />
      <rect x="274" y="173" width="12" height="166" rx="6" fill="url(#cyanGrad)" />

      <!-- Band 5: 4 kHz -->
      <rect x="304" y="205" width="14" height="102" rx="7" fill="url(#cyanGrad)" />

      <!-- Band 6: 8 kHz -->
      <rect x="334" y="235" width="14" height="42" rx="7" fill="url(#cyanGrad)" />
    </g>

    <!-- Left / Right Stereo Ear Nodes -->
    <!-- Left Ear Indicator -->
    <circle cx="160" cy="256" r="14" fill="#38BDF8" filter="url(#glow)" />
    <text x="160" y="261" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">L</text>

    <!-- Right Ear Indicator -->
    <circle cx="352" cy="256" r="14" fill="#818CF8" filter="url(#glow)" />
    <text x="352" y="261" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">R</text>

    <!-- Sub-20ms Zero Latency Lightning Badge -->
    <g transform="translate(236, 360)">
      <circle cx="20" cy="20" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
      <path d="M 21 8 L 13 22 L 19 22 L 18 32 L 27 18 L 21 18 Z" fill="#38BDF8" />
    </g>
  </g>
</svg>
