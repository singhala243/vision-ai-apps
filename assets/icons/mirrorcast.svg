  <path d="M 216 325 A 50 50 0 0 1 296 325" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" />
  
  <!-- Smartphone Screen at bottom foreground -->
  <rect x="206" y="330" width="100" height="140" rx="16" fill="#1E293B" stroke="#FFFFFF" stroke-width="6" />
  <rect x="220" y="345" width="72" height="100" rx="8" fill="#3B82F6" />
  <circle cx="256" cy="458" r="4" fill="#FFFFFF" />
  
  <!-- Content mirrored inside TV -->
