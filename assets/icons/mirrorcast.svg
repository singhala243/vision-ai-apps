<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#mirBg)" />
  
  <!-- TV Monitor Screen -->
  <rect x="120" y="90" width="272" height="180" rx="18" fill="#0F172A" stroke="#93C5FD" stroke-width="8" />
  <rect x="226" y="270" width="60" height="30" fill="#93C5FD" />
  <rect x="196" y="300" width="120" height="12" rx="6" fill="#93C5FD" />
  
  <!-- Beaming signal waves between TV & Phone -->
