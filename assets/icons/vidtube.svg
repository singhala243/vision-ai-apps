<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#vidBg)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Screen container -->
  <rect x="86" y="116" width="340" height="280" rx="36" fill="#0F172A" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />
  
  <!-- Play Button -->
  <polygon points="216,196 346,256 216,316" fill="url(#playGrad)" filter="url(#shadow)" />
  
  <!-- 4K Badge -->
  <rect x="310" y="136" width="96" height="36" rx="10" fill="#EF4444" />
  <text x="358" y="161" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">4K ULTRA</text>
</svg>