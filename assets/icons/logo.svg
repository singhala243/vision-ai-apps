<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#logoBg)" stroke="#1E293B" stroke-width="4" />
  
  <!-- Outer Neural Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Vision Aperture / Stylized V & AI Core -->
  <g filter="url(#logoShadow)">
    <!-- Stylized AI Prism / Eye -->
    <path d="M 120 256 C 170 170, 342 170, 392 256 C 342 342, 170 342, 120 256 Z" 
          fill="none" stroke="url(#logoGlow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Core Lens -->
    <circle cx="256" cy="256" r="48" fill="url(#logoGlow)" />
    <circle cx="256" cy="256" r="24" fill="#0F172A" />
    <circle cx="270" cy="242" r="8" fill="#FFFFFF" />
  </g>
</svg>
